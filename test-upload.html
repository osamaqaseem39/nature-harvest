<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .upload-area { border: 2px dashed #ccc; padding: 20px; text-align: center; margin: 20px 0; }
        .result { margin: 20px 0; padding: 10px; background: #f0f0f0; }
        .error { background: #ffebee; color: #c62828; }
        .success { background: #e8f5e8; color: #2e7d32; }
        img { max-width: 300px; margin: 10px; }
    </style>
</head>
<body>
    <h1>File Upload Test</h1>
    
    <div class="upload-area">
        <input type="file" id="fileInput" accept="image/*" multiple>
        <p>Select image files to upload</p>
    </div>
    
    <div id="result"></div>
    
    <script>
        document.getElementById('fileInput').addEventListener('change', async function(e) {
            const files = e.target.files;
            if (files.length === 0) return;
            
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>Uploading...</p>';
            
            for (let file of files) {
                const formData = new FormData();
                formData.append('file', file);
                
                try {
                    const response = await fetch('upload.php', {
                        method: 'POST',
                        body: formData
                    });
                    
                    const result = await response.json();
                    
                    if (result.success) {
                        resultDiv.innerHTML += `
                            <div class="success">
                                <h3>Upload Successful: ${file.name}</h3>
                                <p><strong>Saved as:</strong> ${result.data.files[0].filename}</p>
                                <p><strong>URL:</strong> <a href="${result.data.files[0].url}" target="_blank">${result.data.files[0].url}</a></p>
                                <img src="${result.data.files[0].url}" alt="Uploaded image">
                                <details>
                                    <summary>Debug Info</summary>
                                    <pre>${JSON.stringify(result.data.debug, null, 2)}</pre>
                                </details>
                            </div>
                        `;
                    } else {
                        resultDiv.innerHTML += `
                            <div class="error">
                                <h3>Upload Failed: ${file.name}</h3>
                                <p>${result.message}</p>
                            </div>
                        `;
                    }
                } catch (error) {
                    resultDiv.innerHTML += `
                        <div class="error">
                            <h3>Upload Error: ${file.name}</h3>
                            <p>${error.message}</p>
                        </div>
                    `;
                }
            }
        });
    </script>
</body>
</html>
